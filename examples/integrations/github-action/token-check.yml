# Copy to .github/workflows/token-check.yml in your repository, and token-check.js to .github/scripts/token-check.js.
# Runs once a day and on demand; the job fails if any listed token gains a power you did not allow.
name: Token check

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save github:blixvip/solana-token-meta
      - name: Check tokens
        env:
          # Optional: a keyed RPC from a repository secret. Without it the free public RPC is used.
          SOLANA_RPC_URL: ${{ secrets.SOLANA_RPC_URL }}
        run: >
          node .github/scripts/token-check.js
          DezXAZ8z7PnrnRJjz3wXBoRgixCa6xjnB7YaB1pPB263
          DxYWLXgKJpQmfhTG7ikK6oX6oDhxMhN5wCs5BJekpump
